[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyspec"
version = "1.0.0"
description = "Spectral estimates from in-situ oceanographic data and models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cesar B Rocha", email = "crocha@usp.br" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "xarray>=2023.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/pyspec/pyspec"

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
docs = ["sphinx", "sphinx-autodoc-typehints"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "NPY"]
